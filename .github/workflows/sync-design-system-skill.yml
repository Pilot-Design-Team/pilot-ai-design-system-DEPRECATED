name: Sync Design System to Skills Library

on:
  push:
    branches: [main]
    paths:
      - 'pilot-design-system.md'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout design system repo
        uses: actions/checkout@v4

      - name: Checkout prompts library
        uses: actions/checkout@v4
        with:
          repository: Pilot-Design-Team/marketing-prompts-library
          path: prompts-library
          token: ${{ secrets.PROMPTS_LIBRARY_TOKEN }}

      - name: Build skill file
        run: |
          cat > /tmp/skill-header.md << 'HEADER'
          ---
          name: pilot-design-system
          description: Reference guide for Pilot's brand and design system. Use this skill whenever you are creating, designing, or reviewing any visual content for Pilot — including web artifacts, landing pages, mockups, slide decks, emails, social assets, or co-branded materials. Covers Pilot's full CSS variable library, typography (Euclid Circular B, Space Mono, La Belle Aurore), color palette (purple scale, named brand colors, accent palette), button and card styles, layout rules, iconography, illustration style, and photography guidelines. Always consult this skill before generating any Pilot-branded visual output, even for quick mockups or single-component designs.
          ---

          > **Canonical source:** [`pilot-design-system.md` in marketing-website-design-system](https://github.com/Pilot-Design-Team/marketing-website-design-system/blob/main/pilot-design-system.md)
          > This file is auto-synced. If you have web access, check the canonical source for the latest version. Do not edit this file directly — changes should be made in the source repo.

          HEADER

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' /tmp/skill-header.md

          cat /tmp/skill-header.md pilot-design-system.md > prompts-library/pilot-design-system/SKILL.md

      - name: Check for changes
        id: changes
        working-directory: prompts-library
        run: |
          git diff --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        working-directory: prompts-library
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pilot-design-system/SKILL.md
          git commit -m "chore: sync pilot-design-system skill from source

          Auto-synced from Pilot-Design-Team/marketing-website-design-system@${{ github.sha }}"
          git push
